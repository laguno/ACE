<p style="margin: 0; font-size: 13px; font-weight: 800; text-align: left; line-height: 1.35;">Hai 5 chiavi: le tieni tutte. Il prossimo forziere ne chiede 7.</p>
</div>
<button type="button" style="width: 100%; min-height: 54px; margin-top: 4px; border: 0; border-radius: 999px; background: #C2185B; color: #FFFFFF; font-family: 'Baloo 2', Nunito, sans-serif; font-size: 19px; font-weight: 800; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.22), 0 10px 20px rgba(194, 24, 91, 0.25);">Vedi il premio</button>
<p style="margin: 0; padding-top: 8px; border-top: 2px dashed #F3E6FD; width: 100%; font-size: 13px; font-weight: 800; color: #5E4470;">Nuova figurina: Leo tennista. Album 15/64.</p>

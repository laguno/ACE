<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Lani — Dieci minuti, timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C6FF3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 28px; background: #14162E; font-family: Nunito, system-ui, sans-serif; color: #FFFFFF">

  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
    <path d="M-40 640 L430 470 M-40 680 L430 510" stroke="#C6FF3D" stroke-opacity="0.14" stroke-width="14"></path>
    <path d="M195 0 V844 M20 130 H370 M20 720 H370" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3"></path>
  </svg>
  <span aria-hidden="true" style="position: absolute; left: -10px; bottom: 40px; font-family: 'Bebas Neue', sans-serif; font-size: 260px; line-height: 1; color: #C6FF3D; opacity: 0.06">10</span>

  <div style="position: relative; width: 100%; display: flex; align-items: center; justify-content: space-between">
    <span style="padding: 3px 10px; background: #C6FF3D; color: #14162E; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.08em; transform: skewX(-10deg)">{{tipo}}</span>
    <button type="button" aria-label="Esci" style="min-width: 44px; min-height: 44px; border: 2px solid #2F3260; border-radius: 999px; background: transparent; color: #B9BCE0; font-family: inherit; font-size: 14px; font-weight: 800; padding: 0 14px; cursor: pointer">Esci</button>
  </div>

  <div style="position: relative; margin-top: 46px; width: 270px; height: 270px">
    <svg width="270" height="270" viewBox="0 0 270 270" aria-hidden="true">
      <circle cx="135" cy="135" r="118" fill="none" stroke="#24274A" stroke-width="18"></circle>
      <circle cx="135" cy="135" r="118" fill="none" stroke="#C6FF3D" stroke-width="18" stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="{{offset}}" transform="rotate(-90 135 135)"></circle>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
      <sc-if value="{{finito}}" hint-placeholder-val="{{ false }}">
<img src="assets/lani-festeggia.webp" alt="" width="190" height="190" style="display: block; width: 190px; height: 190px; object-fit: contain;">
      </sc-if>
      <sc-if value="{{inCorso}}" hint-placeholder-val="{{ true }}">
        <span role="timer" aria-label="Tempo rimasto {{tempo}}" style="font-family: 'Bebas Neue', sans-serif; font-size: 96px; line-height: 0.9; letter-spacing: 0.02em">{{tempo}}</span>
        <span style="font-size: 14px; font-weight: 800; color: #B9BCE0">{{sottoTempo}}</span>
      </sc-if>
    </div>
  </div>

  <div style="position: relative; margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <h1 style="margin: 0; font-family: 'Bebas Neue', sans-serif; font-size: 58px; font-weight: 400; line-height: 0.9; letter-spacing: 0.02em">{{titolo}}</h1>
    <span style="font-size: 16px; font-weight: 800; color: #B9BCE0">{{riga}}</span>
  </div>

  <div style="flex: 1"></div>

  <div style="position: relative; width: 100%; display: flex; align-items: center; gap: 10px; margin-bottom: 14px">
    <img src="{{coachImg}}" alt="" width="84" height="84" style="display: block; width: 84px; height: 84px; object-fit: contain; flex: none">
    <span style="position: relative; flex: 1; padding: 12px 14px; border-radius: 16px; background: #24274A; font-size: 15px; font-weight: 800; line-height: 1.3">{{rigaCoach}}</span>
  </div>

  <sc-if value="{{inCorso}}" hint-placeholder-val="{{ true }}">
    <button type="button" style="position: relative; width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 3px solid #C6FF3D; border-radius: 18px; background: transparent; color: #C6FF3D; font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em; cursor: pointer">
      <sc-if value="{{pausa}}" hint-placeholder-val="{{ false }}">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="#C6FF3D"></path></svg>
      </sc-if>
      <sc-if value="{{corre}}" hint-placeholder-val="{{ true }}">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="#C6FF3D"></rect><rect x="14" y="4.5" width="4" height="15" rx="1" fill="#C6FF3D"></rect></svg>
      </sc-if>
      {{bottone}}
    </button>
  </sc-if>
  <sc-if value="{{finito}}" hint-placeholder-val="{{ false }}">
    <button type="button" style="position: relative; width: 100%; min-height: 60px; border: 0; border-radius: 18px; background: #C6FF3D; color: #14162E; font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.06em; cursor: pointer; box-shadow: 0 6px 0 #8DBA1F">SEGNA FATTO</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stato":{"editor":"enum","options":["in corso","pausa","finito"],"default":"in corso","section":"Prototipo"},"esercizio":{"editor":"enum","options":["Stretching","Plank e squat","Beat Saber"],"default":"Stretching","section":"Prototipo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const stato = this.props.stato ?? 'in corso';
    const es = this.props.esercizio ?? 'Stretching';
    const recupero = es === 'Stretching';
    const finito = stato === 'finito';
    const rimasti = 462; // 7:42 di 10:00
    const giro = 741.4;
    const offset = finito ? 0 : Math.round(giro * (1 - rimasti / 600) * 10) / 10;
    const righe = { 'Stretching': 'Gambe e schiena, piano piano', 'Plank e squat': 'Un minuto ciascuno, poi cambi', 'Beat Saber': 'Sul visore, livello facile' };
    return {
      tipo: recupero ? 'RECUPERO' : 'FORZA E RIFLESSI',
      finito, inCorso: !finito, pausa: stato === 'pausa', corre: stato === 'in corso',
      offset, tempo: '7:42', sottoTempo: stato === 'pausa' ? 'in pausa' : 'di 10:00',
      titolo: finito ? 'FATTI!' : es.toUpperCase(),
      riga: finito ? 'Dieci minuti di ' + es.toLowerCase() + '.' : righe[es],
      bottone: stato === 'pausa' ? 'RIPRENDI' : 'PAUSA',
      coachImg: finito ? 'assets/allenatore-applaude.webp' : 'assets/allenatore-pollice.webp',
      rigaCoach: finito ? 'Allenamento fatto. Brava, così si lavora.' : 'Timer partito. Fino in fondo, poi spunta.'
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Lani — La mia settimana, versione pulita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2185B}a:hover{color:#8E1043}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; padding: 22px 20px; background: linear-gradient(180deg, #FFE3EF 0, #F3E6FD 300px, #FFF6FA 700px); font-family: Nunito, system-ui, sans-serif; color: #3D2350; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 14px; font-weight: 800; color: #5E4470">23 – 29 novembre</span>
      <h1 style="margin: 0; font-family: 'Baloo 2', Nunito, sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1">La mia settimana</h1>
    </div>
    <img src="assets/lani-determinata.webp" alt="" width="92" height="92" style="display: block; width: 92px; height: 92px; object-fit: contain; margin: -12px -6px -12px 0">
  </div>

  <section aria-label="Le chiavi" style="background: #FFFFFF; border-radius: 24px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 24px rgba(123, 106, 224, 0.14)">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="display: flex; gap: 2px" aria-hidden="true">
        <sc-for list="{{chiavi}}" as="k" hint-placeholder-count="3">
          <img src="{{k.img}}" alt="" width="40" height="40" style="display: block; width: 40px; height: 40px; object-fit: contain; {{k.opac}}">
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Baloo 2', Nunito, sans-serif; font-size: 22px; font-weight: 800; line-height: 1.1">{{titolo}}</span>
        <span style="font-size: 14px; font-weight: 800; color: {{coloreSotto}}">{{sotto}}</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; height: 18px; border-radius: 999px; background: #FFE3EF">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pctPassi}}%; border-radius: 999px; background: #E23D8E"></div>
        <div style="position: absolute; left: {{pctAtteso}}%; top: -6px; width: 3px; height: 30px; margin-left: -1.5px; border-radius: 2px; background: #3D2350"></div>
        <div style="position: absolute; left: 70%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 999px; background: #FFFFFF; border: 2px solid #C99A1E; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="5" fill="none" stroke="#C99A1E" stroke-width="3"></circle><path d="M13 12h9M18 12v3" fill="none" stroke="#C99A1E" stroke-width="3" stroke-linecap="round"></path></svg>
        </div>
      </div>
      <div style="position: relative; height: 18px; font-size: 12px; font-weight: 900">
        <span style="position: absolute; left: 0">Passi</span>
        <span style="position: absolute; left: {{pctAtteso}}%; transform: translateX(-50%); white-space: nowrap">oggi</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; height: 18px; border-radius: 999px; background: #DCEFFF">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pctCose}}%; border-radius: 999px; background: #2A6FB0"></div>
        <div style="position: absolute; left: {{pctAtteso}}%; top: -6px; width: 3px; height: 30px; margin-left: -1.5px; border-radius: 2px; background: #3D2350"></div>
        <div style="position: absolute; left: 95%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 999px; background: #FFFFFF; border: 2px solid #C99A1E; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="5" fill="none" stroke="#C99A1E" stroke-width="3"></circle><path d="M13 12h9M18 12v3" fill="none" stroke="#C99A1E" stroke-width="3" stroke-linecap="round"></path></svg>
        </div>
      </div>
      <div style="position: relative; height: 18px; font-size: 12px; font-weight: 900">
        <span style="position: absolute; left: 0">Cose</span>
        <span style="position: absolute; right: 0; color: #2A6FB0">{{coseTesto}}</span>
      </div>
    </div>
  </section>

  <section aria-label="Giorno per giorno" style="background: #FFFFFF; border-radius: 24px; padding: 14px 10px 12px; box-shadow: 0 10px 24px rgba(123, 106, 224, 0.14)">
    <div style="display: grid; grid-template-columns: 96px repeat(7, minmax(0, 1fr)); align-items: center">
      <span></span>
      <sc-for list="{{giorni}}" as="g" hint-placeholder-count="7">
        <span style="{{g.stile}}">{{g.sigla}}</span>
      </sc-for>
    </div>
    <sc-for list="{{righe}}" as="r" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 96px repeat(7, minmax(0, 1fr)); align-items: center; min-height: 46px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 30px; height: 30px; border-radius: 999px; flex: none; background: {{r.fondo}}; display: flex; align-items: center; justify-content: center">
            <span style="width: 10px; height: 10px; border-radius: 999px; background: {{r.colore}}"></span>
          </span>
          <span style="font-size: 13px; font-weight: 900">{{r.nome}}</span>
        </div>
        <sc-for list="{{r.celle}}" as="c" hint-placeholder-count="7">
          <div style="{{c.colonna}}">
            <div style="{{c.stile}}">
              <sc-if value="{{c.fatta}}" hint-placeholder-val="{{ false }}">
                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </sc-if>
              <sc-if value="{{c.persa}}" hint-placeholder-val="{{ false }}">
                <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#9580CF" stroke-width="3" stroke-linecap="round"></path></svg>
              </sc-if>
              <sc-if value="{{c.jolly}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 11px; font-weight: 900; color: #561530">J</span>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </section>

  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 800; color: #5E4470; cursor: pointer">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#5E4470" stroke-width="2"></circle><path d="M12 11v6M12 7.5v.5" fill="none" stroke="#5E4470" stroke-width="2.4" stroke-linecap="round"></path></svg>
    Come si prendono le chiavi
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"inPari":{"editor":"boolean","default":true,"section":"Prototipo"},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const inPari = this.props.inPari ?? true;
    const oggi = 2; // mercoledì
    // per ogni riga: quante cose per giorno (n) e quante fatte (f); i giorni dopo oggi non hanno fatte
    const def = [
      { nome: 'Compiti', fondo: '#F3E6FD', colore: '#6B4FC0', n: [3, 2, 3, 4, 3, 0, 0], f: [3, 2, 1, 0, 0, 0, 0] },
      { nome: 'Ripasso', fondo: '#FFF3C4', colore: '#8A6400', n: [0, 1, 1, 0, 0, 0, 0], f: [0, 1, 0, 0, 0, 0, 0] },
      { nome: 'Cartella', fondo: '#DCEFFF', colore: '#2A6FB0', n: [1, 1, 1, 1, 0, 0, 1], f: [1, inPari ? 1 : 0, 0, 0, 0, 0, 0] },
      { nome: 'Borsa', fondo: '#FFE3EF', colore: '#C2185B', n: [0, 0, 0, 1, 0, 0, 1], f: [0, 0, 0, 0, 0, 0, 0] },
      { nome: '10 minuti', fondo: '#7B2342', colore: '#F6D3DE', n: [1, 1, 1, 1, 1, 1, 1], f: [1, 0, 0, 0, 0, 0, 0], dieci: true }
    ];
    const base = 'width: 26px; height: 26px; border-radius: 999px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;';
    let jolly = 1;
    let tot = 0, fatte = 0, attese = 0, perse = 0;
    const righe = def.map((r) => ({
      nome: r.nome, fondo: r.fondo, colore: r.colore,
      celle: r.n.map((n, d) => {
        const colonna = 'display: flex; justify-content: center; align-self: stretch; align-items: center;' + (d === oggi ? ' background: #FFF6FA; box-shadow: inset 0 0 0 2px #FFC8E1;' : '');
        tot += n; fatte += r.f[d];
        if (d <= oggi) attese += n;
        if (!n) return { colonna, stile: base + ' width: 5px; height: 5px; background: #E9DCF5;', fatta: false, persa: false, jolly: false };
        const piena = r.dieci ? '#7B2342' : r.colore;
        if (r.f[d] >= n) return { colonna, stile: base + ' background: ' + piena + ';', fatta: true, persa: false, jolly: false };
        if (d < oggi) {
          if (r.dieci && jolly > 0) { jolly--; return { colonna, stile: base + ' background: #F6D3DE;', fatta: false, persa: false, jolly: true }; }
          perse += n - r.f[d];
          return { colonna, stile: base + ' border: 2px dashed #CDB8F5;', fatta: false, persa: true, jolly: false };
        }
        if (d === oggi) return { colonna, stile: base + ' border: 3px solid ' + piena + '; background: #FFFFFF;', fatta: false, persa: false, jolly: false };
        return { colonna, stile: base + ' width: 18px; height: 18px; border: 2px solid #E9DCF5;', fatta: false, persa: false, jolly: false };
      })
    }));
    const sigle = ['Lu', 'Ma', 'Me', 'Gi', 'Ve', 'Sa', 'Do'];
    const giorni = sigle.map((s, d) => ({ sigla: s, stile: 'text-align: center; font-size: 13px; font-weight: 900; padding: 6px 0;' + (d === oggi ? ' color: #C2185B; background: #FFF6FA; border-radius: 12px 12px 0 0; box-shadow: inset 0 2px 0 #FFC8E1, inset 2px 0 0 #FFC8E1, inset -2px 0 0 #FFC8E1;' : ' color: #5E4470;') }));
    const pctPassi = Math.round((fatte / tot) * 100);
    const pctAtteso = Math.round((attese / tot) * 100);
    const pctCose = Math.min(100, pctPassi + 3); // di prova: le cose pesano tutte uguali, i passi no
    const coseTesto = fatte + ' di ' + tot;
    // sticker veri come nell'app: chiave-vuota finché non è presa (domenica), sbiadita se è a rischio
    const possibile = { img: 'assets/chiave-vuota.webp', opac: '' };
    // una cosa saltata lascia ancora la terza chiave (95% delle cose), ma senza più margine
    const aRischio = { img: 'assets/chiave-vuota.webp', opac: 'opacity: 0.35;' };
    return {
      righe, giorni, pctPassi, pctAtteso, pctCose, coseTesto,
      chiavi: perse ? [possibile, possibile, aRischio] : [possibile, possibile, possibile],
      titolo: 'Tre chiavi in gioco',
      sotto: perse ? 'Per la terza non puoi saltare più niente.' : 'Sei in pari. Oggi: 4 cose.',
      coloreSotto: perse ? '#8A4B00' : '#2E7D32'
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Lani — Oggi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2185B}a:hover{color:#8E1043}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #FFF7FB; font-family: Nunito, 'Segoe UI', system-ui, sans-serif; color: #2B1D3A; display: flex; flex-direction: column">

  <div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #6E5A80">LUNEDÌ 23 NOVEMBRE</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 900">Oggi</h1>
    </div>

    <section aria-label="La giornata in breve" style="background: #FFFFFF; border: 1px solid #F1E4F3; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 18px rgba(194, 24, 91, 0.08)">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 800">Le cose di oggi</span>
        <span style="font-size: 15px; font-weight: 900; color: #C2185B">{{fatteOggi}} di {{totOggi}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{segmenti}}" as="s" hint-placeholder-count="6">
          <div style="{{s.stile}}"></div>
        </sc-for>
      </div>
      <span style="font-size: 12px; font-weight: 700; color: #6E5A80">{{fraseGiornata}}</span>
    </section>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: #EEF6FD; font-size: 13px; font-weight: 800; color: #1B4F80">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#1B4F80" stroke-width="2"></circle><path d="M3.5 9.5c5 1.5 12 1.5 17 0M5 17c4-2.5 10-2.5 14 0M12 3c-3 5-3 13 0 18" fill="none" stroke="#1B4F80" stroke-width="1.6"></path></svg>
      <span>Allenamento 16:00–18:00 · fai i compiti prima</span>
    </div>

    <div role="tablist" aria-label="Momenti della giornata" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border: 1px solid #F1E4F3; border-radius: 999px; padding: 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.stile}}">{{t.nome}}</button>
      </sc-for>
    </div>

    <sc-for list="{{gruppi}}" as="g" hint-placeholder-count="1">
      <section aria-label="{{g.titolo}}" style="background: #FFFFFF; border: 1px solid #F1E4F3; border-radius: 22px; padding: 6px 8px; display: flex; flex-direction: column">
        <div style="margin: 10px 10px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 900">{{g.titolo}}</h2>
          <span style="font-size: 12px; font-weight: 700; color: #6E5A80">{{g.sotto}}</span>
        </div>
        <sc-if value="{{g.vuoto}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 4px 10px 12px; font-size: 14px; font-weight: 700; line-height: 1.45; color: #2B1D3A; white-space: pre-line">{{g.nota}}</p>
        </sc-if>
        <sc-for list="{{g.voci}}" as="v" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{v.premuto}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 10px; border: 0; border-top: 1px solid #F6EEF7; background: transparent; text-align: left; font-family: inherit; color: #2B1D3A; cursor: pointer">
            <span style="{{v.cerchio}}">
              <sc-if value="{{v.fatta}}" hint-placeholder-val="{{ false }}">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </sc-if>
            </span>
            <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
              <span style="{{v.stileNome}}">{{v.nome}}</span>
              <span style="font-size: 12px; font-weight: 700; color: #6E5A80">{{v.dettaglio}}</span>
            </span>
            <span style="{{v.stilePassi}}">+{{v.passi}}</span>
          </button>
        </sc-for>
      </section>
    </sc-for>

    <section aria-label="Passi in più" style="background: transparent; border: 1px dashed #DCC9E4; border-radius: 22px; padding: 6px 8px; display: flex; flex-direction: column">
      <div style="margin: 10px 10px 4px; display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; color: #6E5A80">PASSI IN PIÙ</h2>
        <span style="font-size: 11px; font-weight: 700; color: #6E5A80">fanno salire Astra, non le chiavi</span>
      </div>
      <sc-for list="{{extra}}" as="v" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{v.premuto}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 10px; border: 0; border-top: 1px solid #F1E4F3; background: transparent; text-align: left; font-family: inherit; color: #2B1D3A; cursor: pointer">
          <span style="{{v.cerchio}}">
            <sc-if value="{{v.fatta}}" hint-placeholder-val="{{ false }}">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </sc-if>
          </span>
          <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
            <span style="font-size: 14px; font-weight: 800">{{v.nome}}</span>
            <span style="font-size: 12px; font-weight: 700; color: #6E5A80">{{v.dettaglio}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 800; color: #6E5A80">{{v.passiTesto}}</span>
        </button>
      </sc-for>
    </section>
  </div>

  <div style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #F1E4F3; box-shadow: 0 -6px 18px rgba(43, 29, 58, 0.06)">
    <a href="Main.dc.html" aria-label="La mia settimana: passi {{pctPassi}} per cento, cose {{pctCose}} per cento, chiavi {{chiaviPrese}} su 3" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; text-decoration: none; color: #2B1D3A">
      <span style="display: flex; flex-direction: column; gap: 5px; flex: 1">
        <span style="position: relative; display: block; height: 6px; border-radius: 999px; background: #FBE3EF">
          <span style="display: block; width: {{pctPassi}}%; height: 6px; border-radius: 999px; background: #C2185B"></span>
          <span style="position: absolute; left: 70%; top: -3px; width: 2px; height: 12px; border-radius: 2px; background: #2B1D3A"></span>
        </span>
        <span style="position: relative; display: block; height: 6px; border-radius: 999px; background: #E3F1FC">
          <span style="display: block; width: {{pctCose}}%; height: 6px; border-radius: 999px; background: #6FB6F0"></span>
          <span style="position: absolute; left: 95%; top: -3px; width: 2px; height: 12px; border-radius: 2px; background: #2B1D3A"></span>
        </span>
      </span>
      <span style="display: flex; gap: 2px" aria-hidden="true">
        <sc-for list="{{chiavi}}" as="k" hint-placeholder-count="3">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <circle cx="8" cy="12" r="5" fill="{{k.fill}}" stroke="{{k.tratto}}" stroke-width="2"></circle>
            <path d="M13 12h9M18 12v3" fill="none" stroke="{{k.tratto}}" stroke-width="2.2" stroke-linecap="round"></path>
          </svg>
        </sc-for>
      </span>
    </a>

    <nav aria-label="Menu principale" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 2px 8px 14px">
      <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: #C2185B; font-size: 11px; font-weight: 900">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        Oggi
      </a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: #6E5A80; font-size: 11px; font-weight: 800">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.5 6.7 19.3l1.1-5.9-4.4-4.1 6-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
        Astra
      </a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: #6E5A80; font-size: 11px; font-weight: 800">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M3.5 9.5c5 1.5 12 1.5 17 0M5 17c4-2.5 10-2.5 14 0M12 3c-3 5-3 13 0 18" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
        R-Evo
      </a>
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; text-decoration: none; color: #6E5A80; font-size: 11px; font-weight: 800">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="13" y="5" width="8" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect></svg>
        Album
      </a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"momento":{"editor":"enum","options":["mattina","pomeriggio","sera"],"default":"pomeriggio","section":"Prototipo"},"giornata":{"editor":"range","default":50,"min":0,"max":100,"step":1,"unit":"%","section":"Prototipo"},"settimana":{"editor":"range","default":18,"min":0,"max":100,"step":1,"unit":"%","section":"Prototipo"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const pctG = Math.max(0, Math.min(100, this.props.giornata ?? 50));
    const pctS = Math.max(0, Math.min(100, this.props.settimana ?? 18));
    const def = [
      { id: 'mattina', nome: 'Mattina', titolo: 'Prima di uscire', sotto: 'scuola 8:00–13:00', voci: [],
        nota: 'Niente da spuntare.\nOggi a scuola: matematica, storia, tecnologia.\nPorta la cartellina di tecnologia.' },
      { id: 'pomeriggio', nome: 'Pomeriggio', titolo: 'Compiti e studio', sotto: 'prima dell’allenamento', voci: [
        { nome: 'Matematica', dettaglio: 'Per domani · pag. 266', passi: 10 },
        { nome: 'Storia', dettaglio: 'Per domani · pag. 105-109', passi: 10 },
        { nome: 'Inglese', dettaglio: 'Per mercoledì', passi: 10 },
        { nome: 'Ripasso di scienze', dettaglio: 'Verifica giovedì · sessione 1 di 3', passi: 10 }
      ] },
      { id: 'sera', nome: 'Sera', titolo: 'Chiusura della sera', sotto: 'entro le 21:00', voci: [
        { nome: 'Dieci minuti', dettaglio: 'Recupero dopo l’allenamento', passi: 10 },
        { nome: 'Cartella per domani', dettaglio: 'Martedì: inglese, scienze, arte', passi: 5 }
      ], nota: '' }
    ];
    const scelto = (this.state && this.state.tab) || this.props.momento || 'pomeriggio';
    const tutte = [];
    def.forEach((g) => g.voci.forEach((v) => tutte.push(v)));
    const quante = Math.round((pctG / 100) * tutte.length);
    tutte.forEach((v, i) => { v.fatta = i < quante; });
    const cerchio = (fatta, d) => 'width: ' + d + 'px; height: ' + d + 'px; flex: none; border-radius: 999px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;' + (fatta ? ' background: #C2185B;' : ' border: 2px solid #BBA7CC; background: #FFFFFF;');
    const tabs = def.map((g) => {
      const fatte = g.voci.filter((v) => v.fatta).length;
      const conto = g.voci.length ? ' ' + fatte + '/' + g.voci.length : '';
      const sel = g.id === scelto;
      return {
        nome: g.nome + conto,
        sel: sel ? 'true' : 'false',
        pick: () => this.setState({ tab: g.id }),
        stile: 'min-height: 44px; border: 0; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer;' + (sel ? ' background: #2B1D3A; color: #FFFFFF;' : ' background: transparent; color: #2B1D3A;')
      };
    });
    const gruppi = def.filter((g) => g.id === scelto).map((g) => ({
      titolo: g.titolo,
      sotto: g.sotto,
      vuoto: !g.voci.length || !!g.nota,
      nota: g.nota || '',
      voci: g.voci.map((v) => ({
        nome: v.nome, dettaglio: v.dettaglio, passi: v.passi, fatta: v.fatta,
        premuto: v.fatta ? 'true' : 'false',
        cerchio: cerchio(v.fatta, 28),
        stileNome: 'font-size: 15px; font-weight: 800;' + (v.fatta ? ' color: #6E5A80;' : ''),
        stilePassi: 'font-size: 14px; font-weight: 900; min-width: 36px; text-align: right;' + (v.fatta ? ' color: #C2185B;' : ' color: #6E5A80;')
      }))
    }));
    const passiOggi = tutte.reduce((s, v) => s + v.passi, 0);
    const passiFatti = tutte.filter((v) => v.fatta).reduce((s, v) => s + v.passi, 0);
    const segmenti = tutte.map((v) => ({ stile: 'height: 10px; border-radius: 999px;' + (v.fatta ? ' background: #C2185B;' : ' background: #FBE3EF;') }));
    const mancano = tutte.length - quante;
    const extraDef = [
      { nome: 'Foto delle pagine di matematica', dettaglio: 'Chiesta da ACE', passiTesto: '+2', fatta: pctG >= 50 },
      { nome: 'Pillola di flash card', dettaglio: 'Scienze e storia, 4 minuti', passiTesto: '+3', fatta: false },
      { nome: 'Quiz di scienze', dettaglio: 'Dopo i compiti', passiTesto: 'fino a +10', fatta: false }
    ];
    const extra = extraDef.map((v) => ({ ...v, premuto: v.fatta ? 'true' : 'false', cerchio: cerchio(v.fatta, 24) }));
    const k1 = pctS >= 70;
    const k3 = k1 && pctS >= 95;
    const chiave = (presa) => ({ fill: presa ? '#F2B233' : '#FFFFFF', tratto: presa ? '#A86A00' : '#CDBFD8' });
    return {
      totOggi: tutte.length,
      fatteOggi: quante,
      segmenti,
      fraseGiornata: mancano === 0 ? 'Giornata chiusa: ' + passiOggi + ' passi, tutti per le chiavi.' : passiFatti + ' passi presi su ' + passiOggi + '. Ne mancano ' + mancano + '.',
      tabs,
      gruppi,
      extra,
      pctPassi: pctS,
      pctCose: Math.max(0, pctS - 4),
      chiaviPrese: (k1 ? 2 : 0) + (k3 ? 1 : 0),
      chiavi: [chiave(k1), chiave(k1), chiave(k3)]
    };
  }
}
</script>
</body>
</html>
